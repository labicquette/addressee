wandb:
  offline: false
  project:  addresseecontext
  name: train

data:

  dataset_path: /store/scratch/tcharlot/data/addresseeV2
  classes: binary_classes

# necessary info for pred/eval
audio:
  #chunk_duration_s: 0.575
  chunk_duration_s: 4
  sample_rate: 16_000
  # True if pyannet, False if Whisper
  strict_frames: false


model_type: wav2vec
model_id: wav2vec2_base
# model_id: wavlm_base_plus
# model_id: wavlm_base
# model_id: wav2vec2_base
# model_id: wav2vec2_xlsr




freeze_encoder : false
reduction: false
plots: false

train:
#  lr: 0.000142
  lr: 0.00001
  batch_size: 16
  max_epochs: 10
  classifier: 256

  # validation_metric: auroc
  validation_metric: loss
  # [loss, partial_loss, label_loss, f1_score, auroc, roc]
  # [loss (includes label_loss), f1_score]
  extra_val_metrics: [loss, f1_score]
  # simple or advanced (python <= 3.11)
  profiler: null

  dataloader:
    num_workers: 8

  scheduler:
    patience: 3

  optim:
    scheduler: tristage
    init_lr_scale: 0.01
    final_lr_scale: 0.05
    warmup_steps: 5000
    hold_steps: 12500
    decay_steps: 7500