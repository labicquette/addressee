wandb:
  offline: true
  project:  addresseejzfix
  name: train

data:

  dataset_path: /lustre/fswork/projects/rech/kqg/commun/addressee_dataset
  classes: binary_classes

# necessary info for pred/eval
audio:
  #chunk_duration_s: 0.575
  chunk_duration_s: 4
  sample_rate: 16_000
  # True if pyannet, False if Whisper
  strict_frames: false


model_type: wav2vec
# One of (wav2vec2_base, wav2vec2_large, wav2vec2_xlsr_300m)
model_id: wav2vec2_base
# Path to a checkpoint (for w2v2_ll4300) or null (resolves to None)
model_checkpoint: null


freeze_encoder : false
reduction: false
plots: false

train:
#  lr: 0.000142
  lr: 0.00001
  batch_size: 16
  max_epochs: 10
  classifier: 256

  # validation_metric: auroc
  validation_metric: loss
  # [loss, partial_loss, label_loss, f1_score, auroc, roc]
  # [loss (includes label_loss), f1_score]
  extra_val_metrics: [loss, f1_score]
  # simple or advanced (python <= 3.11)
  profiler: null

  dataloader:
    num_workers: 8

  scheduler:
    patience: 3

  optim:
    scheduler: tristage
    init_lr_scale: 0.01
    final_lr_scale: 0.05
    warmup_steps: 5000
    hold_steps: 12500
    decay_steps: 7500